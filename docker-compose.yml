services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: carbuddy
      POSTGRES_PASSWORD: carbuddy
      POSTGRES_DB: carbuddy
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carbuddy']
      interval: 5s
      retries: 10

volumes:
  pgdata:
